name: Secure Supply Chain Workflow

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write
  id-token: write # Yêu cầu bắt buộc để dùng cosign keyless

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    env:
      IMAGE_TAG: ${{ github.sha }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/volunteerhub-${{ matrix.service }}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build Image tương ứng với service
      - name: Build Image
        working-directory: ./${{ matrix.service }}
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # 2. Chạy Trivy để quét lỗ hổng và xuất báo cáo HTML
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'html'
          output: 'trivy-results-${{ matrix.service }}.html'
          exit-code: '0' # Đổi thành 0 để không báo lỗi pipeline khi phát hiện lỗ hổng
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: Trivy-Report-${{ matrix.service }}
          path: trivy-results-${{ matrix.service }}.html

      # 3. Sinh SBOM bằng Syft
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          output-file: 'sbom-${{ matrix.service }}.spdx.json'
          format: 'spdx-json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: SBOM-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

      # 4. Push Image lên Registry
      - name: Push Image
        run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 5. Cài đặt Cosign và Ký Image
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Image
        run: cosign sign --yes ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  verify-deploy:
    needs: build-scan-sign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    env:
      IMAGE_TAG: ${{ github.sha }}
      
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/volunteerhub-${{ matrix.service }}" >> $GITHUB_ENV
        
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
